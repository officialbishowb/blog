services:
  blog:
    build: .
    ports:
      - "3002:3000"
    restart: unless-stopped
    # no published port: only reachable through the tunnel

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - blog
