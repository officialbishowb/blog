services:
  blog:
    build:
      context: .
      args:
        - NEXT_PUBLIC_TINA_PUBLIC_CLIENT_ID=${NEXT_PUBLIC_TINA_PUBLIC_CLIENT_ID}
        - NEXT_PUBLIC_TINA_TOKEN=${NEXT_PUBLIC_TINA_TOKEN}
        - NEXT_PUBLIC_TINA_PUBLIC_BRANCH=${NEXT_PUBLIC_TINA_PUBLIC_BRANCH:-main}
    ports:
      - "3001:3000"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - blog
